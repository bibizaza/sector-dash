<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sector Performance</title>
<style>
  :root{
    color-scheme: light dark;
    --surface:#fcfcfb; --plane:#f9f9f7;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --hair:#e1e0d9; --ring:rgba(11,11,11,.10);
    --pos:#0ca30c; --neg:#d03b3b; --zero:#f0efec;
    --chip-pos:rgba(12,163,12,.10); --chip-neg:rgba(208,59,59,.10);
    /* Rerating is deliberately NOT red/green — a multiple expanding is not a
       sell. Gold reads "richer", teal "cheaper", neither reads as a trade. */
    --rich:#c07c12; --cheap:#0d8fa3;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme=light]){
    --surface:#1a1a19; --plane:#0d0d0d;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --hair:#2c2c2a; --ring:rgba(255,255,255,.10); --zero:#383835;
    --chip-pos:rgba(12,163,12,.18); --chip-neg:rgba(208,59,59,.18);
    --rich:#e3a63f; --cheap:#43bdd2;
  }}
  [data-theme=dark]{
    --surface:#1a1a19; --plane:#0d0d0d;
    --ink:#fff; --ink-2:#c3c2b7; --hair:#2c2c2a;
    --ring:rgba(255,255,255,.10); --zero:#383835;
    --chip-pos:rgba(12,163,12,.18); --chip-neg:rgba(208,59,59,.18);
    --rich:#e3a63f; --cheap:#43bdd2;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}   /* .grid's display would win over it */
  body{margin:0;background:var(--plane);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin-bottom:4px}
  h1{margin:0;font-size:34px;letter-spacing:-.02em}
  .as-of{color:var(--muted);font-size:13px;flex-basis:100%;margin-top:-4px}
  .regions{display:inline-flex;background:var(--surface);border:1px solid var(--ring);
    border-radius:11px;padding:3px;gap:2px}
  .regions button{border:0;background:none;font:inherit;font-size:13.5px;font-weight:600;
    padding:7px 18px;border-radius:8px;color:var(--ink-2);cursor:pointer}
  .regions button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 8px}
  .controls button{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;
    border:1px solid var(--ring);background:var(--surface);color:var(--ink-2);cursor:pointer}
  .controls button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .ctlrow{display:flex;align-items:center;gap:10px;margin:0 0 8px}
  .ctlrow .controls{margin:0}
  .ctlbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted)}
  .brow.bench{border-top:1px solid var(--hair);margin-top:4px;padding-top:9px}
  .brow.bench .bname{color:var(--ink-2);font-weight:700}
  .grid{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);
    gap:22px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .slice{cursor:pointer;transition:opacity .13s}
  #donut.dim .slice{opacity:.22}
  #donut.dim .slice.on{opacity:1}
  .lbl{font-size:11.5px;fill:var(--ink-2)}
  .lbl-v{font-size:11.5px;font-weight:600}
  .hub{font-size:12px;fill:var(--ink-2)}
  .hub-v{font-size:22px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--hair)}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    font-weight:600;cursor:pointer;user-select:none}
  th.num,td.num{text-align:right}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--plane)}
  tbody tr.hot{background:var(--plane);outline:1px solid var(--ring)}
  .bar{display:inline-block;width:3px;height:15px;border-radius:2px;
    vertical-align:-3px;margin-right:9px}
  .chip{display:inline-block;min-width:74px;padding:3px 9px;border-radius:6px;
    font-weight:600;font-size:13.5px;text-align:right}
  .chip.p{background:var(--chip-pos);color:var(--pos)} .chip.n{background:var(--chip-neg);color:var(--neg)}
  tr.total td{font-weight:700;border-bottom:2px solid var(--hair)}
  .w{color:var(--muted);font-size:12px}
  .cbar{position:relative;width:104px;height:12px;margin:4px 0 0 auto}
  .cbar .zero{position:absolute;left:50%;top:0;width:1px;height:100%;background:var(--hair)}
  .cbar i{position:absolute;top:3px;height:6px;border-radius:2px}
  tr.resid td{color:var(--muted);font-style:italic;border-top:1px solid var(--hair)}
  #valuation{overflow-x:auto}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  @media(max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .vcard{border:1px solid var(--ring);border-radius:12px;padding:13px 14px}
  .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .chead h3{margin:0;font-size:13.5px;letter-spacing:-.01em;line-height:1.25}
  .score{flex:none;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;
    color:var(--ink);font-variant-numeric:tabular-nums}
  .vcard .big{font-size:27px;font-weight:700;letter-spacing:-.022em;margin:6px 0 1px}
  .vcard .cap{font-size:10.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em}
  .mini{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11px}
  .mini .lbl{width:62px;color:var(--muted)}
  .mtrack{position:relative;flex:1;height:5px;background:var(--hair);border-radius:3px}
  .mtrack .iq{position:absolute;left:25%;width:50%;top:0;height:5px;border-radius:3px;
    background:#b7d3f6}
  .mtrack i{position:absolute;top:-2.5px;width:10px;height:10px;border-radius:50%;
    margin-left:-5px;background:var(--ink);border:1.5px solid var(--surface)}
  .mini .mv{width:52px;text-align:right;font-variant-numeric:tabular-nums;
    font-weight:600;color:var(--ink-2)}
  .ctx{display:flex;align-items:center;gap:34px}
  .ctxnum{flex:0 0 290px}
  .ctxchart{flex:1;min-width:0}
  @media(max-width:820px){.ctx{flex-wrap:wrap}.ctxnum{flex:1 1 100%}}
  .ctxbig{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1}
  .ctxsub{font-size:12.5px;color:var(--ink-2);margin-top:5px;max-width:340px;line-height:1.45}
  .ctxsub b{color:var(--ink)}
  .brow{display:flex;align-items:center;gap:14px;padding:5px 0}
  .bname{width:190px;text-align:right;font-size:13px;font-weight:600;flex:none}
  .btrack{position:relative;flex:1;height:19px;background:var(--plane);border-radius:4px;
    border:1px solid var(--hair)}
  .btrack .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .btrack .med{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);
    opacity:.55}
  /* dumbbell: hollow dot = a week ago, solid = today, the segment is the move */
  .btrack.dumb{background:none;border:0}
  .btrack.dumb .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;
    background:var(--hair)}
  .btrack .conn{position:absolute;top:50%;height:3px;margin-top:-1.5px;border-radius:2px}
  .btrack .dot{position:absolute;top:50%;width:11px;height:11px;
    margin:-5.5px 0 0 -5.5px;border-radius:50%;box-sizing:border-box}
  .btrack .dot.was{background:var(--surface);border:1.5px solid var(--muted)}
  .btrack .par{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink);
    opacity:.38}
  #valmove{margin:22px 0;padding-top:18px;border-top:1px solid var(--hair)}
  #valmove:not(:empty)+#valscatter{padding-top:18px;border-top:1px solid var(--hair)}
  .bval{width:58px;text-align:right;font-size:12.5px;font-weight:700;
    font-variant-numeric:tabular-nums;flex:none}
  .bmeta{width:92px;text-align:right;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums;flex:none}
  .brow.bhead{padding-bottom:9px;margin-bottom:4px;border-bottom:1px solid var(--hair);
    align-items:flex-end}
  .brow.bhead .bval,.brow.bhead .bmeta{font-size:10.5px;font-weight:600;line-height:1.3;
    text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .btrack.bhdr{background:none;border:0;display:flex;justify-content:space-between;
    font-size:10.5px;color:var(--muted);height:auto}
  .btrack.bhdr span{position:absolute;left:50%;transform:translateX(-50%)}
  .dumbkey{display:inline-flex;align-items:center;gap:5px;margin-left:9px;
    font-size:11.5px;color:var(--muted);white-space:nowrap}
  /* the legend dots sit outside .btrack, so they carry their own geometry */
  .dumbkey i{width:9px;height:9px;flex:none;border-radius:50%;background:var(--ink);
    box-sizing:border-box}
  .dumbkey i.was{background:var(--surface);border:1.5px solid var(--muted)}
  .crow{display:flex;align-items:center;gap:14px;padding:5px 0}
  .cname{width:190px;text-align:right;font-size:13px;font-weight:600;flex:none}
  .ctrack{position:relative;flex:1;height:19px}
  .czero{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--hair)}
  .ctrack i{position:absolute;top:3px;height:13px;border-radius:2.5px;opacity:.88}
  .cval{position:absolute;top:2px;font-size:12px;font-weight:700;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .cval.inside{color:#fff}
  .cmeta{width:132px;text-align:right;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;flex:none}
  .cfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);
    font-size:11.5px;color:var(--muted);line-height:1.6}
  .scatterhead{margin:0 0 4px;font-size:15px;font-weight:700}
  .scatterlede{color:var(--muted);font-size:12px;margin-bottom:10px}
  .sortbtn{border:1px solid var(--ring);background:var(--surface);font:inherit;
    font-size:12px;padding:4px 11px;border-radius:7px;color:var(--ink-2);cursor:pointer}
  table.val td{vertical-align:top}
  .vnum{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .rng{position:relative;width:132px;height:18px;margin:7px 0 0 auto}
  .rng .track{position:absolute;top:8px;left:0;right:0;height:3px;border-radius:2px;
    background:var(--hair)}
  .rng .iqr{position:absolute;top:6px;height:7px;border-radius:3px;background:#b7d3f6}
  .rng .med{position:absolute;top:3px;width:1.5px;height:13px;background:var(--muted)}
  .rng .cur{position:absolute;top:2.5px;width:11px;height:11px;border-radius:50%;
    margin-left:-5.5px;background:var(--ink);border:2px solid var(--surface);
    box-shadow:0 0 0 1px var(--ink)}
  .vpct{font-size:10.5px;color:var(--muted);margin-top:4px;letter-spacing:.01em}
  .vends{display:flex;justify-content:space-between;font-size:9.5px;
    color:var(--muted);margin-top:1px;width:132px;margin-left:auto}
  .vhint{color:var(--muted);font-size:12px;margin:2px 0 16px}
  .subnav{display:inline-flex;gap:4px;margin:14px 0 2px}
  .subnav button{border:1px solid var(--ring);background:var(--surface);font:inherit;
    font-size:13px;font-weight:600;padding:6px 16px;border-radius:9px;
    color:var(--ink-2);cursor:pointer}
  .subnav button[aria-pressed=true]{background:var(--ink);color:var(--surface);
    border-color:var(--ink)}
  #heat{overflow-x:auto}
  table.heat{table-layout:fixed}
  table.heat th,table.heat td{border-bottom:0;padding:3px}
  table.heat thead th{text-transform:none;letter-spacing:0;font-size:11.5px;
    white-space:normal;text-align:center;vertical-align:bottom;cursor:default;
    color:var(--ink-2);padding-bottom:7px}
  table.heat tbody th{text-align:left;font-size:14px;text-transform:none;
    letter-spacing:0;color:var(--ink);cursor:default;white-space:nowrap;padding-right:12px}
  table.heat tbody th small{display:block;color:var(--muted);font-size:11px;font-weight:500}
  .cell{border-radius:7px;text-align:center;font-size:13px;font-weight:600;
    padding:14px 4px;cursor:pointer;transition:box-shadow .1s}
  .cell.na{color:var(--muted);font-weight:400}
  .cell.hot{box-shadow:0 0 0 2px var(--ink) inset}
  .idx{text-align:center;font-size:13.5px;font-weight:700;padding:14px 4px;
    border-right:1px solid var(--hair)}
  footer{color:var(--muted);font-size:12px;margin-top:22px;line-height:1.7}
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9;
    background:var(--surface);border:1px solid var(--ring);border-radius:11px;overflow:hidden;
    min-width:212px;box-shadow:0 10px 30px rgba(0,0,0,.18);white-space:nowrap}
  .tip-h{display:flex;align-items:center;gap:8px;padding:10px 13px 1px;
    font-size:13.5px;font-weight:700}
  .tip-dot{width:9px;height:9px;border-radius:3px;flex:none}
  .tip-tk{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em}
  .tip-w{color:var(--muted);font-size:11.5px;padding:0 13px 9px 30px}
  .tip-g{display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--hair)}
  .tip-g span{padding:5px 13px;font-size:12.5px;font-variant-numeric:tabular-nums}
  .tip-g .k{color:var(--muted);letter-spacing:.05em}
  .tip-g .v{text-align:right;font-weight:600}
  .tip-g .on{background:var(--plane);font-weight:800}
</style></head><body>

const CROSS = "Cross-region", PERF = "Performance", VAL = "Valuation", BRD = "Breadth";

// here would read as buy/sell, and valuation tested negative as a signal
// (fwd P/E z-score IC -0.012 over 10.5y) — the colour must not imply a trade.
const ord = n => { const v = Math.round(n), t = v % 10, h = v % 100;
  return v + ((t === 1 && h !== 11) ? "st" : (t === 2 && h !== 12) ? "nd"
            : (t === 3 && h !== 13) ? "rd" : "th"); };
const seq = p => {
  const t = Math.max(0, Math.min(1, p / 100));
  const light = css("--surface").length === 7;
  return light ? `rgb(${Math.round(205-113*t)},${Math.round(226-88*t)},${Math.round(251-104*t)})`
               : `rgb(${Math.round(28+29*t)},${Math.round(56+63*t)},${Math.round(92+87*t)})`;
};

const missingNote = () => (D.missing || []).length

    `(the Bloomberg terminal was unreachable) and ${D.missing.length > 1 ? "are" : "is"} ` +
    `not shown.` : "";

// exactly as it always did; picking a lookback is what swaps in the dumbbell.
// It only exists if the window is longer than the lookback — otherwise the
// earlier date predates the window's own start bar.
const comparing = () => back !== TODAY && D.windows.indexOf(win) > D.windows.indexOf(back);
// Valuation has no return window to outrun, so asking is enough.
const comparingVal = () => back !== TODAY;

// Heatmap column headers — the full GICS names don't fit twelve columns.
const SHORT = {
  "Information Technology":"Info Tech", "Communication Services":"Comm Svcs",
  "Consumer Discretionary":"Cons Disc", "Consumer Staples":"Cons Staples",
};

const pct = v => v == null ? "n/a" : (v >= 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));

// Diverging: red — neutral — green, ramped by |return| against the window's max.
// `scale` dials the whole ramp down for fills that sit under text (the hub).
function colour(r, max, scale = 1){
  if (r == null) return css("--zero");
  const mid = hex(css("--zero").length===7 ? css("--zero") : "#f0efec");
  const pole = hex(r >= 0 ? css("--pos") : css("--neg"));
  const t = max > 0 ? Math.min(1, Math.abs(r) / max) : 0;
  const k = (0.25 + 0.75 * t) * scale;           // never fully washed out at 0
  return "rgb(" + mid.map((c,i) => Math.round(c + (pole[i]-c)*k)).join(",") + ")";
}

// One control can move another's state, so the pressed marks are set from the
// state on every draw rather than only by the click that caused them.
function syncTabs(){
  for (const [id, cur] of [["win", win], ["back", back]])
    document.querySelectorAll(`#${id} button`).forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.v === cur));
}

function sorted(data){
  return [...data].sort((a,b) => {
    const A = a[sortKey], B = b[sortKey];
    if (A == null) return 1; if (B == null) return -1;
    return (typeof A === "string" ? A.localeCompare(B) : A - B) * sortDir;
  });
}

const arc = (cx,cy,Rd,r,a0,a1) => {
  const p = (rad,a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  const big = a1-a0 > Math.PI ? 1 : 0;
  const [x1,y1]=p(Rd,a0), [x2,y2]=p(Rd,a1), [x3,y3]=p(r,a1), [x4,y4]=p(r,a0);
  return `M${x1} ${y1}A${Rd} ${Rd} 0 ${big} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${big} 0 ${x4} ${y4}Z`;
};

let valRelative = true;   // relative-to-index is the honest default (see drawVal)

function draw(){
  const cross = view === CROSS;
  const reg0 = D.regions[view] || {};
  const hasVal = !cross && !!reg0.valuation;
  const hasBrd = !cross && !!(reg0.breadth && Object.keys(reg0.breadth).length);
  if ((sub === VAL && !hasVal) || (sub === BRD && !hasBrd)) sub = PERF;
  const val = !cross && sub === VAL;
  const brd = !cross && sub === BRD;
  // Performance draws today's snapshot, OR the comparison — never both.
  const snap = !cross && !val && !brd && !comparing();
  document.getElementById("heat").hidden = !cross;
  document.getElementById("valuation").hidden = !val;
  document.getElementById("regionview").hidden = !snap;
  document.getElementById("contribwrap").hidden = !snap;
  document.getElementById("ctxwrap").hidden = !snap;
  document.getElementById("breadthwrap").hidden = !brd;
  document.getElementById("movewrap").hidden = cross || val || brd || !comparing();
  document.getElementById("win").hidden = cross ? false : val;
  document.getElementById("backrow").hidden = cross || brd;
  syncTabs();
  const sn = document.getElementById("subnav");
  sn.hidden = cross;

    sn.innerHTML = [PERF, ...(hasVal ? [VAL] : []), ...(hasBrd ? [BRD] : [])].map(k =>
      `<button data-v="${k}" aria-pressed="${k === sub}">${k}</button>`).join("");
    sn.onclick = e => { const v = e.target.dataset?.v; if (!v) return; sub = v; draw(); };

  cross ? drawHeat() : val ? drawVal() : brd ? drawBreadth() : snap ? drawRegion() : drawMove();

// Valuation as cards, ranked by an expensiveness score, plus a scatter of that
// score against momentum.
//
// The score averages the PERCENTILES of the three multiples, never the raw
// ratios: P/E runs near 1.2x, EV/EBITDA near 1.5x and P/B near 3.0x, so
// averaging the levels would simply let P/B decide the ranking. FCF yield is
// shown on the card but kept out of the score — it goes negative (Utilities
// burn cash), which a "how expensive" average cannot absorb.
const SCORE_KEYS = ["pe_fwd", "ev_ebitda", "pb"];
let valSort = "rich";

const richPct = (m, d) => d == null ? null : (m.cheap_high ? 100 - d.pct : d.pct);

function valScore(s, M){
  const ps = SCORE_KEYS.map(k => {
    const m = M.find(x => x.key === k), d = (s.metrics[k] || {})[valRelative ? "rel" : "abs"];
    return d ? richPct(m, d) : null;
  }).filter(x => x != null);
  return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
}

function drawVal(){

  if (!v){ document.getElementById("valcards").innerHTML =

  rows.sort((a, b) => valSort === "rich" ? b.score - a.score : a.score - b.score);

  document.getElementById("valcards").innerHTML = rows.map(s => {

      <div class="big">${d ? fmt(head, d.cur) : "n/a"}</div>
      <div class="cap">${head.label} · ${d ? ord(richPct(head, d)) + " pct" : "—"}</div>
      ${minis}</div>`;
  }).join("");

  if (comparingVal()) drawValMove(v, rows, M, fmt);
  else document.getElementById("valmove").innerHTML = "";
  drawValScatter(v, rows, M, fmt);

  document.getElementById("valhint").innerHTML =
    `<b>${valRelative ? "Versus the " + v.index + " excluding that sector"
                      : "Absolute levels"}</b> · badge is the average percentile across ` +
    `${head.label}, ${M[1].label} and ${M[2].label} over ${v.years} years; bars place today ` +
    `in that history · <a href="#" id="valsort">${valSort === "rich" ? "cheapest first"
                                                                    : "most expensive first"}</a>` +
    ` · <a href="#" id="valtoggle">${valRelative ? "absolute levels" : "ex-sector"}</a>`;
  document.getElementById("valtoggle").onclick = e => {
    e.preventDefault(); valRelative = !valRelative; drawVal(); };
  document.getElementById("valsort").onclick = e => {
    e.preventDefault(); valSort = valSort === "rich" ? "cheap" : "rich"; drawVal(); };

  document.getElementById("asof").textContent =
    `${v.index} sectors · valuation as of ${v.as_of}`;
  document.getElementById("foot").innerHTML =
    (valRelative
      ? `Each sector is compared with the ${v.index} <b>excluding itself</b>: a big sector ` +
        `measured against an index it dominates is largely measured against itself, which ` +
        `pulls the ratio toward 1.0 (US tech reads 1.15x against the whole index, 1.22x ` +
        `against ex-tech). <b>*</b> EV/EBITDA substitutes market cap for enterprise value, ` +
        `so its ex-sector figure is approximate where leverage is unusual.<br>`
      : `Absolute levels, uncorrected — nearly every sector reads expensive because the ` +
        `whole market re-rated. Use the ex-sector view for anything sector-specific.<br>`) +
    `Descriptive only. Sector valuation was tested as a predictor over 10.5 years and did ` +
    `not work — forward-P/E z-score IC <b>-0.012</b> (t -0.82), trailing <b>-0.005</b> ` +
    `(t -0.37), both the wrong sign. The scatter shows what has already happened, not ` +
    `what will.<br>Source: Bloomberg · generated ${D.generated}`;
}

// Valuation against what the sector has already done. Cheap-and-falling is a
// different problem from cheap-and-rising, and the table cannot show that.
// The multiple itself, now against `back` ago. The cards give the percentile;
// this gives the size of the premium, and those are not the same fact — a
// sector can sit near its own 10-year high at 1.3x while another is mid-range
// at the same level. The heavy line is 1.00x: parity with the index ex-sector.
function drawValMove(v, rows, M, fmt){
  const el = document.getElementById("valmove"), m = M[0];
  const side = valRelative ? "rel" : "abs";
  const pts = rows.map(s => {
    const d = (s.metrics[m.key] || {})[side] || {};
    return {name: s.name, cur: d.cur, was: ((d.prev || {})[back] || {}).v};
  }).filter(p => p.cur != null && p.was != null)
    .sort((a, b) => b.cur - a.cur);
  if (pts.length < 3){ el.innerHTML = ""; return; }

  const parity = valRelative && m.rel !== "spread" ? 1 : null;
  const vals = pts.flatMap(p => [p.cur, p.was]).concat(parity == null ? [] : [parity]);
  const pad = (Math.max(...vals) - Math.min(...vals)) * 0.06 || 0.01;
  const lo = Math.min(...vals) - pad, hi = Math.max(...vals) + pad;
  const X = x => (x - lo) / (hi - lo) * 100;

  el.innerHTML = `<div class="scatterhead">${m.label} — now against ${back} ago</div>
    <div class="scatterlede">The premium itself, not its rank. A percentile says where a
      sector sits in its own history; this says how much you are actually paying${parity
        ? `, against <b>1.00x</b> — parity with the ${v.index} excluding that sector` : ""}.
      <span class="dumbkey"><i class="was"></i>${back} ago<i></i>now</span></div>
    <div class="brow bhead"><div class="bname"></div>
      <div class="btrack bhdr">${fmt(m, lo)}${parity == null ? "<span></span>"
        : `<span style="left:${X(parity).toFixed(2)}%">1.00x</span>`}${fmt(m, hi)}</div>
      <div class="bval">Now</div>
      <div class="bmeta">${back}<br>ago</div>
      <div class="bmeta">Rerating</div></div>` +
    pts.map(p => {
      const g = p.cur / p.was - 1;
      const flat = Math.abs(g) < 0.001;
      const col = flat ? "var(--muted)" : g > 0 ? "var(--rich)" : "var(--cheap)";
      const a = X(Math.min(p.cur, p.was)), b = X(Math.max(p.cur, p.was));
      return `<div class="brow" data-name="${p.name}">
        <div class="bname">${p.name}</div>
        <div class="btrack dumb">
          ${parity == null ? "" : `<div class="par" style="left:${X(parity).toFixed(2)}%"></div>`}
          <div class="conn" style="left:${a.toFixed(2)}%;width:${(b - a).toFixed(2)}%;
               background:${col}"></div>
          <div class="dot was" style="left:${X(p.was).toFixed(2)}%"></div>
          <div class="dot" style="left:${X(p.cur).toFixed(2)}%;background:${col}"></div>
        </div>
        <div class="bval">${fmt(m, p.cur)}</div>
        <div class="bmeta">${fmt(m, p.was)}</div>
        <div class="bmeta" style="color:${col};font-weight:${flat ? 400 : 600}"
          >${flat ? "unch" : (g > 0 ? "+" : "") + (g * 100).toFixed(1) + "%"}</div></div>`;
    }).join("");
}

function drawValScatter(v, rows, M, fmt){
  const perf = ((D.regions[view] || {}).sectors) || [];
  const ret = n => (perf.find(p => p.name === n) || {}).returns?.["1Y"];
  const pts = rows.map(s => ({...s, y: ret(s.name)})).filter(s => s.y != null);
  if (pts.length < 3){ document.getElementById("valscatter").innerHTML = ""; return; }

  const W = 1060, H = 400, P = 58;
  const ys = pts.map(p => p.y), ylo = Math.min(...ys), yhi = Math.max(...ys);
  const pad = (yhi - ylo) * 0.14 || 0.01;
  const X = p => P + p / 100 * (W - 2 * P);
  const Y = y => H - P - (y - (ylo - pad)) / ((yhi + pad) - (ylo - pad)) * (H - 2 * P);
  const maxw = Math.max(...perf.map(p => p.weight || 0), 1);
  const y0 = Y(0), inRange = y0 > P && y0 < H - P;

  let o = `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block;overflow:visible">
    <line x1="${X(50)}" y1="${P - 8}" x2="${X(50)}" y2="${H - P + 8}" stroke="var(--hair)"/>`;
  if (inRange) o += `<line x1="${P - 8}" y1="${y0}" x2="${W - P + 8}" y2="${y0}"
      stroke="var(--hair)"/>`;
  // Nudge labels apart: several sectors cluster tightly and the names collide.
  const marks = pts.map(s => {
    const w = (perf.find(p => p.name === s.name) || {}).weight || 1;
    const r = 7 + Math.sqrt(w / maxw) * 17;
    return {...s, cx: X(s.score), cy: Y(s.y), r, ly: Y(s.y) - r - 6};
  }).sort((a, b) => a.ly - b.ly);
  for (let i = 1; i < marks.length; i++)
    if (Math.abs(marks[i].cx - marks[i-1].cx) < 170 && marks[i].ly - marks[i-1].ly < 21)
      marks[i].ly = marks[i-1].ly + 21;
  for (const s of marks){
    o += `<circle cx="${s.cx.toFixed(1)}" cy="${s.cy.toFixed(1)}" r="${s.r.toFixed(1)}"
            fill="${seq(s.score)}" stroke="#2a78d6" stroke-width="1.4" opacity=".92"/>
          <text x="${s.cx.toFixed(1)}" y="${s.ly.toFixed(1)}"
            text-anchor="middle" class="lbl"
            style="font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3.5px"
            >${s.name}</text>`;
  }
  // The y-axis needs numbers, or "1-year total return" is unreadable.
  for (const t of [yhi, (yhi + ylo) / 2, ylo])
    o += `<text x="${P - 14}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" class="lbl"
            style="fill:var(--muted);font-size:11px">${(t * 100).toFixed(0)}%</text>`;
  o += `<text x="${W / 2}" y="${H - 16}" text-anchor="middle" class="axis"
          >CHEAP ← VALUATION SCORE VS OWN HISTORY → EXPENSIVE</text>
        <text x="16" y="${H / 2}" text-anchor="middle" class="axis"
          transform="rotate(-90 16 ${H / 2})">1-YEAR TOTAL RETURN →</text></svg>`;
  document.getElementById("valscatter").innerHTML =
    `<div class="scatterhead">Valuation versus momentum</div>
     <div class="scatterlede">Expensiveness score against what the sector has actually
       returned over a year. Bubble size is index weight.</div>${o}`;
}

function drawRegion(){
  const reg = R();
  const data = reg.sectors.map(s => ({...s, ret: s.returns[win],
    contrib: s.returns[win] == null ? null : s.weight / 100 * s.returns[win]}));
  const bench = reg.benchmark_returns[win];
  const max = Math.max(...data.map(s => Math.abs(s.ret ?? 0)));
  const tot = data.reduce((a,s) => a + s.weight, 0);
  const cx=230, cy=230, Rd=150, r=92, gap=0.012;
  let a = -Math.PI/2, out = "";

  for (const s of data){
    const span = 2*Math.PI * s.weight / tot;
    const a0 = a + gap/2, a1 = a + span - gap/2;
    if (a1 > a0)
      out += `<path class="slice" data-name="${s.name}" fill="${colour(s.ret,max)}"
              stroke="var(--surface)" stroke-width="2" d="${arc(cx,cy,Rd,r,a0,a1)}"></path>`;
    // Direct-label only the slices with room; the rest live in the table.
    if (s.weight / tot >= 0.04){
      const m = a + span/2, lr = Rd + 14;
      const x = cx + lr*Math.cos(m), y = cy + lr*Math.sin(m);
      const anch = Math.cos(m) >= 0 ? "start" : "end";
      out += `<text class="lbl" x="${x}" y="${y}" text-anchor="${anch}">${s.name}</text>
              <text class="lbl-v" x="${x}" y="${y+14}" text-anchor="${anch}"
                fill="${(s.ret ?? 0) >= 0 ? "var(--pos)" : "var(--neg)"}">${pct(s.ret)}</text>`;
    }
    a += span;
  }
  // Hub fill stays a pale tint of the sign so the text on top keeps its contrast.
  out += `<circle cx="${cx}" cy="${cy}" r="${r-6}" fill="${colour(bench,max,0.22)}"
            stroke="var(--surface)" stroke-width="2"></circle>
          <text class="hub" x="${cx}" y="${cy-6}" text-anchor="middle">${reg.index}</text>
          <text class="hub-v" x="${cx}" y="${cy+22}" text-anchor="middle"
            fill="${(bench ?? 0) >= 0 ? "var(--pos)" : "var(--neg)"}">${pct(bench)}</text>`;
  document.getElementById("donut").innerHTML = out;

  const pp = v => v == null ? "n/a" : (v >= 0 ? "+" : "") + (v * 100).toFixed(2) + "pp";
  const sumC = data.reduce((a, s) => a + (s.contrib ?? 0), 0);
  const resid = bench == null ? null : bench - sumC;

  document.getElementById("tbody").innerHTML =
    `<tr class="total"><td><span class="bar" style="background:${colour(bench,max)}"></span>${reg.index}
       <span class="w">&nbsp;${reg.index_ticker}</span></td>
       <td class="num w">100.0%</td><td class="num">${pct(bench)}</td></tr>` +
    sorted(data).map(s => `<tr data-name="${s.name}">
       <td><span class="bar" style="background:${colour(s.ret,max)}"></span>${s.name}
           <span class="w">&nbsp;${s.ticker}</span></td>
       <td class="num w">${s.weight.toFixed(1)}%</td>
       <td class="num"><span class="chip ${(s.ret ?? 0) >= 0 ? "p" : "n"}">${pct(s.ret)}</span></td>
     </tr>`).join("") +
    "";
  drawContrib(reg, data, bench, resid, pp);
  drawContext(reg, bench);

  document.getElementById("rethead").textContent = `% Total return (${reg.ccy})`;
  document.getElementById("asof").textContent =
    `${reg.index} · prices as of close ${reg.as_of} · returns in ${reg.ccy}`;
  const gap_pct = 100 - reg.coverage;
  document.getElementById("foot").innerHTML =
    `<b>Contribution</b> is the sector's weight times its return — what it added to ` +
    `the index, not just how it moved. It reconciles over a day; over longer windows ` +
    `today's weights no longer describe the period, and that gap is the residual row ` +
    `(small for 1D, wide YTD).<br>` +
    `Sector returns are the ${reg.family} (total return, ${reg.ccy}); ` +
    `<b>${reg.index}</b> is ${reg.index_ticker}'s own return, not the average of the sectors. ` +
    (reg.source === "bloomberg"
      ? `Ring width is the sector index's market cap over the country index's — the exact ` +
        `index weight.`
      : `Ring width is the sector's share of ${reg.index_ticker} as reported by the data ` +
        `provider (Morningstar classification — close to GICS, not identical), for sizing only.`) +
    (gap_pct > 0.05
      ? `<br>${data.length} of the 11 GICS sectors are covered: this family has no line for the ` +
        `rest (${gap_pct.toFixed(1)}% of the index), so it is not shown and the ring is scaled ` +
        `to what is.`
      : "") + missingNote() +
    `<br>Source: ${SOURCE[reg.source]} · generated ${D.generated}`;
  wire(data, max);
}

// One tooltip for both views: the sector, a context line, and every window at
// once with the one currently on screen picked out.
const tip = () => document.getElementById("tip");
function tipShow(e, s, max, sub){
  const t = tip();
  t.innerHTML =
    `<div class="tip-h"><span class="tip-dot" style="background:${colour(s.returns[win],max)}"></span>
       ${s.name}<span class="tip-tk">${s.ticker}</span></div>
     <div class="tip-w">${sub}</div>
     <div class="tip-g">` +
    D.windows.map(w => {
      const v = s.returns[w], on = w === win ? " on" : "";
      return `<span class="k${on}">${w}</span><span class="v${on}"
        style="color:${(v ?? 0) >= 0 ? "var(--pos)" : "var(--neg)"}">${pct(v)}</span>`;
    }).join("") + `</div>`;
  t.style.opacity = 1;
  t.style.left = Math.min(e.clientX + 16, innerWidth - t.offsetWidth - 10) + "px";
  t.style.top  = Math.min(e.clientY + 16, innerHeight - t.offsetHeight - 10) + "px";
}
const tipHide = () => { tip().style.opacity = 0; };

// Ranked contribution: the return column says how a sector MOVED, this says what
// it ADDED. Today Industrials fell 3.19% and tech 2.64%, but Industrials put in
// -0.27pp against tech's -1.01pp of a -1.54pp index — tech was the day.
function drawContrib(reg, data, bench, resid, pp){
  const el = document.getElementById("contrib");
  const rows = data.filter(s => s.contrib != null)
                   .sort((a, b) => b.contrib - a.contrib);
  if (!rows.length){ el.innerHTML = ""; return; }
  const m = Math.max(...rows.map(s => Math.abs(s.contrib)));
  const half = 46;                     // % of the track each side of zero

  el.innerHTML = `<div class="scatterhead">What moved ${reg.index}</div>
    <div class="scatterlede">Weight times return — what each sector added to the
      index over ${win}, not just how far it moved.</div>` +
    rows.map(s => {
      const w = Math.max(0.6, Math.abs(s.contrib) / m * half);
      const pos = s.contrib >= 0;
      return `<div class="crow" data-name="${s.name}">
        <div class="cname">${s.name}</div>
        <div class="ctrack"><div class="czero"></div>
          <i style="${pos ? "left:50%" : `left:${(50 - w).toFixed(2)}%`};
             width:${w.toFixed(2)}%;background:${pos ? "var(--pos)" : "var(--neg)"}"></i>
          ${w > half * 0.72
            // A long bar pushes its outside label into the sector name, so once
            // the bar is long enough to hold the text, the text goes inside it.
            ? `<span class="cval inside" style="${pos ? `left:50%;margin-left:9px`
                                                      : `right:50%;margin-right:9px`}"
                 >${pp(s.contrib)}</span>`
            : `<span class="cval" style="${pos ? `left:${(50 + w).toFixed(2)}%;margin-left:9px`
                                              : `right:${(50 + w).toFixed(2)}%;margin-right:9px`}"
                 >${pp(s.contrib)}</span>`}</div>
        <div class="cmeta">${pct(s.ret)} · ${s.weight.toFixed(1)}%</div>
      </div>`;
    }).join("") +
    `<div class="cfoot">Index ${pp(bench)} · parts sum to ${pp(bench - resid)} ·
       <b>${pp(resid)}</b> is weight drift and uncovered sectors. Contribution
       reconciles over a day; over longer windows today's weights no longer
       describe the period.</div>`;
}

// A headline return says nothing about whether the move was unusual. Placed in
// ten years of the SAME window, -1.54% turns out to be a -1.4 sigma day, worse
// than only 6% of days — ordinary, which is the useful thing to know.
function drawContext(reg, bench){
  const d = (reg.dist || {})[win];
  const el = document.getElementById("ctx");
  document.getElementById("ctxwrap").hidden = !d;
  if (!d) return;
  const PW = 700, H = 92, P = 8, nb = d.counts.length;
  const mx = Math.max(...d.counts), bw = (PW - 2 * P) / nb;
  const X = v => P + (v - d.lo) / ((d.hi - d.lo) || 1) * (PW - 2 * P);
  let o = `<svg viewBox="0 0 ${PW} ${H}" width="100%" height="${H}"
             preserveAspectRatio="none" style="display:block">`;
  d.counts.forEach((c, i) => {
    const h = mx ? c / mx * (H - 30) : 0;
    o += `<rect x="${(P + i * bw).toFixed(1)}" y="${(H - 22 - h).toFixed(1)}"
            width="${Math.max(0.8, bw - 0.9).toFixed(1)}" height="${h.toFixed(1)}"
            fill="var(--hair)"/>`;
  });
  const cx = Math.max(P, Math.min(PW - P, X(bench)));
  o += `<line x1="${cx.toFixed(1)}" y1="4" x2="${cx.toFixed(1)}" y2="${H - 15}"
          stroke="${bench >= 0 ? "var(--pos)" : "var(--neg)"}" stroke-width="2.5"/>
        <text class="lbl" x="${cx.toFixed(1)}" y="${H - 4}" text-anchor="middle"
          style="font-weight:700;fill:${bench >= 0 ? "var(--pos)" : "var(--neg)"}">now</text>
        <text class="lbl" x="${P}" y="${H - 4}">${(d.lo * 100).toFixed(0)}%</text>
        <text class="lbl" x="${PW - P}" y="${H - 4}" text-anchor="end">+${(d.hi * 100).toFixed(0)}%</text>
        </svg>`;
  // Percentile from the cumulative histogram, sigma from the stored moments —
  // both computed for the number the page is actually displaying.
  const bin = d.hi > d.lo
    ? Math.max(0, Math.min(nb - 1, Math.floor((bench - d.lo) / (d.hi - d.lo) * nb))) : 0;
  let below = 0;
  for (let i = 0; i < bin; i++) below += d.counts[i];
  const pctWorse = below / d.n * 100;
  const sig = d.sd > 0 ? (bench - d.mean) / d.sd : null;
  el.innerHTML = `<div class="ctx">
    <div class="ctxnum"><div class="ctxbig" style="color:${bench >= 0 ? "var(--pos)" : "var(--neg)"}"
        >${pct(bench)}</div>
      <div class="ctxsub">${sig == null ? "" : `A <b>${sig >= 0 ? "+" : ""}${sig.toFixed(1)}σ</b> ${win} move. `}
        ${pctWorse < 50
          ? `Only <b>${pctWorse.toFixed(1)}%</b> of the last 10 years were worse.`
          : `Better than <b>${pctWorse.toFixed(0)}%</b> of the last 10 years.`}
      </div></div><div class="ctxchart">${o}</div></div>`;
}

// Where each sector stood partway through the window, against where it stands
// now. Both readings run from the SAME start bar, so the segment is the ground
// gained or lost since — a bar chart of the window can only show the endpoint.
function drawMove(){
  const reg = R(), el = document.getElementById("move");
  const at = s => ((s.prev || {})[back] || {})[win];
  const rows = reg.sectors.map(s => ({name: s.name, cur: s.returns[win], was: at(s)}))
    .filter(r => r.cur != null && r.was != null)
    .sort((a, b) => b.cur - a.cur);
  if (!rows.length){ el.innerHTML = ""; return; }
  const bench = {name: reg.index, cur: reg.benchmark_returns[win],
                 was: ((reg.benchmark_prev || {})[back] || {})[win]};
  const all = rows.concat(bench.cur != null && bench.was != null ? [bench] : []);

  const vals = all.flatMap(r => [r.cur, r.was]).concat([0]);
  const pad = (Math.max(...vals) - Math.min(...vals)) * 0.05 || 0.005;
  const lo = Math.min(...vals) - pad, hi = Math.max(...vals) + pad;
  const X = v => ((v - lo) / (hi - lo)) * 100;
  // round first, or a -0.0004 return prints as "-0.0%"
  const p1 = v => (Math.abs(v) * 100 < 0.05 ? "" : v > 0 ? "+" : "-")
                + (Math.abs(v) * 100).toFixed(1) + "%";

  const line = (r, cls) => {
    const w = r.cur - r.was;
    const flat = Math.abs(w) < 0.0005;
    const col = flat ? "var(--muted)" : w > 0 ? "var(--pos)" : "var(--neg)";
    const a = X(Math.min(r.cur, r.was)), b = X(Math.max(r.cur, r.was));
    return `<div class="brow ${cls}" data-name="${r.name}">
      <div class="bname">${r.name}</div>
      <div class="btrack dumb">
        <div class="mid" style="left:${X(0).toFixed(2)}%"></div>
        <div class="conn" style="left:${a.toFixed(2)}%;width:${(b - a).toFixed(2)}%;
             background:${col}"></div>
        <div class="dot was" style="left:${X(r.was).toFixed(2)}%"></div>
        <div class="dot" style="left:${X(r.cur).toFixed(2)}%;background:${col}"></div>
      </div>
      <div class="bval" style="color:${r.cur >= 0 ? "var(--pos)" : "var(--neg)"}"
        >${p1(r.cur)}</div>
      <div class="bmeta">${p1(r.was)}</div>
      <div class="bmeta" style="color:${col};font-weight:${flat ? 400 : 600}"
        >${flat ? "unch" : (w > 0 ? "+" : "") + (w * 100).toFixed(1) + "pp"}</div></div>`;
  };

  el.innerHTML = `<div class="scatterhead">${win} return — now against ${back} ago</div>
    <div class="scatterlede">Both dots are the return measured from the same start of the
      ${win} window, so the position is where the sector stood and the segment is the ground
      it has gained or lost since.
      <span class="dumbkey"><i class="was"></i>${back} ago<i></i>now</span></div>
    <div class="brow bhead">
      <div class="bname"></div>
      <div class="btrack bhdr">${p1(lo)}<span style="left:${X(0).toFixed(2)}%">0%</span>${p1(hi)}</div>
      <div class="bval">${win}<br>now</div>
      <div class="bmeta">${back}<br>ago</div>
      <div class="bmeta">Change<br>(pp)</div>
    </div>` + rows.map(r => line(r, "")).join("") +
    (all.length > rows.length ? line(bench, "bench") : "");

  document.getElementById("asof").textContent =
    `${reg.index} · prices as of close ${reg.as_of} · returns in ${reg.ccy}`;
  document.getElementById("foot").innerHTML =
    `Both readings run from the same start bar, so the segment is the change in ` +
    `cumulative return since ${back} ago — that is the sector's move over the stretch ` +
    `compounded onto where it already stood, not the ${back} return on its own.<br>` +
    `Sector returns are the ${reg.family} (total return, ${reg.ccy}).` + missingNote() +
    `<br>Source: ${SOURCE[reg.source] || reg.source} · generated ${D.generated}`;
}

// Was the move broad, or a few large names? Price and participation can
// disagree, and only breadth shows it.
function drawBreadth(){
  const reg = R(), b = reg.breadth || {};
  const el = document.getElementById("breadth");
  const rows = reg.sectors
    .map(s => ({...s, ret: s.returns[win], br: b[s.name]}))
    .filter(s => s.br && s.br.cur != null)
    .sort((x, y) => y.br.cur - x.br.cur);
  if (!rows.length){ el.innerHTML = ""; return; }

  el.innerHTML = `<div class="scatterhead">Breadth — members above their 200-day average</div>
    <div class="scatterlede">How much of each sector is actually participating. A sector can
      fall hard while most of its names hold, or drift lower while participation quietly
      collapses — the return alone cannot tell you which.</div>
    <div class="brow bhead">
      <div class="bname"></div>
      <div class="btrack bhdr">0%<span>50%</span>100%</div>
      <div class="bval">Above<br>200-day</div>
      <div class="bmeta">vs its own<br>1y median</div>
      <div class="bmeta">Return<br>${win}</div>
    </div>` +
    rows.map(s => {
      const good = s.br.cur >= 50;
      const d = s.br.med == null ? null : s.br.cur - s.br.med;
      return `<div class="brow" data-name="${s.name}">
        <div class="bname">${s.name}</div>
        <div class="btrack">
          <div class="fill" style="width:${s.br.cur.toFixed(1)}%;
               background:${good ? "var(--chip-pos)" : "var(--chip-neg)"}"></div>
          ${s.br.med == null ? "" : `<div class="med" style="left:${s.br.med.toFixed(1)}%"></div>`}
        </div>
        <div class="bval" style="color:${good ? "var(--pos)" : "var(--neg)"}"
          >${s.br.cur.toFixed(0)}%</div>
        <div class="bmeta" style="color:${d == null ? "var(--muted)"
            : d >= 0 ? "var(--pos)" : "var(--neg)"}"
          >${d == null ? "—" : (d >= 0 ? "+" : "") + d.toFixed(0) + "pp"}</div>
        <div class="bmeta">${pct(s.ret)}</div></div>`;
    }).join("");

  document.getElementById("asof").textContent =
    `${reg.index} · breadth as of close ${reg.as_of}`;
  document.getElementById("foot").innerHTML =
    `Percent of each sector's members trading above their own 200-day moving average ` +
    `(Bloomberg, index members). The tick on each bar is that sector's median over the ` +
    `past year, and the <b>vs median</b> column is today's reading against it — so a high ` +
    `number that is still below its own median reads as deteriorating, not strong.<br>` +
    `Source: Bloomberg · generated ${D.generated}`;
}

function wire(data, max){
  const svg = document.getElementById("donut");
  // Hovering either the slice or its table row marks both, and fades the rest
  // of the ring so the sector under the cursor is the only thing at full ink.
  const mark = name => {
    svg.classList.toggle("dim", name != null);
    svg.querySelectorAll(".slice").forEach(p =>
      p.classList.toggle("on", p.dataset.name === name));
    document.querySelectorAll("#tbody tr[data-name]").forEach(tr =>
      tr.classList.toggle("hot", tr.dataset.name === name));
  };
  document.querySelectorAll("#regionview [data-name]").forEach(el => {
    const s = data.find(x => x.name === el.dataset.name);
    el.addEventListener("mousemove", e => {
      tipShow(e, s, max, `${s.weight.toFixed(1)}% of index`); mark(el.dataset.name);
    });
    el.addEventListener("mouseleave", () => { tipHide(); mark(null); });
  });
}

function wireHeat(max){
  document.querySelectorAll("#heat .cell[data-name]").forEach(el => {
    const reg = D.regions[el.dataset.region];
    const s = reg.sectors.find(x => x.name === el.dataset.name);
    el.addEventListener("mousemove", e => {
      tipShow(e, s, max, `${el.dataset.region} · ${s.weight.toFixed(1)}% of ${reg.index}`);
      el.classList.add("hot");
    });
    el.addEventListener("mouseleave", () => { tipHide(); el.classList.remove("hot"); });
  });
}

// Items are plain strings, or {v, t} when the label differs from the state.
function tabs(id, items, current, pick){
  const el = document.getElementById(id);
  el.innerHTML = items.map(x =>
    `<button data-v="${x.v ?? x}" aria-pressed="${(x.v ?? x) === current()}">${x.t ?? x}</button>`
  ).join("");
  el.onclick = e => {
    const v = e.target.dataset?.v; if (!v) return;
    pick(v);
    el.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", b.dataset.v === v));
    draw();
  };
}
tabs("regions", [...Object.keys(D.regions), CROSS], () => view, v => { view = v; });
tabs("win", D.windows, () => win, v => { win = v; });
// Asking for a comparison the current window cannot carry (a 1-day return has
// no reading from a week ago) moves the window on rather than doing nothing.
tabs("back", [TODAY, ...D.backs.map(b => ({v: b, t: b + " ago"}))], () => back, v => {
  back = v;
  if (v !== TODAY && D.windows.indexOf(win) <= D.windows.indexOf(v))
    win = D.windows[D.windows.indexOf(v) + 1];
});
document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  sortDir = sortKey === k ? -sortDir : (k === "name" ? 1 : -1);
  sortKey = k; draw();
});
draw();
</script></body></html>
